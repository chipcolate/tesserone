name: Tesserone
options:
  bundleIdPrefix: com.chipcolate
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  groupSortPosition: top
  xcodeVersion: "16.0"
attributes:
  ORGANIZATIONNAME: Chipcolate
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.chipcolate.tesserone
    PRODUCT_NAME: Tesserone
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "17"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: HNF5BY9XXV
    CODE_SIGN_STYLE: Automatic
    SUPPORTS_MACCATALYST: "NO"
packages:
  TesseroneKit:
    path: TesseroneKit
targets:
  Tesserone:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tesserone
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: ../../shared/brands
        group: Shared/Brands
        type: folder
        buildPhase: resources
      - path: ../../shared/i18n
        group: Shared/i18n
        type: folder
        buildPhase: resources
      - path: ../../shared/fonts
        group: Shared/Fonts
        type: folder
        buildPhase: resources
        excludes:
          - README.md
          - OFL.txt
    dependencies:
      - package: TesseroneKit
        product: TesseroneKit
      - target: TesseroneWatch
        embed: true
        codeSign: true
      - target: TesseroneWidget
        embed: true
        codeSign: true
      - target: TesseroneShare
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chipcolate.tesserone
        INFOPLIST_FILE: Tesserone/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Tesserone/Tesserone.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        INFOPLIST_KEY_CFBundleDisplayName: Tesserone
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    scheme:
      testTargets: []
      gatherCoverageData: false
  TesseroneWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: TesseroneWatch
        excludes:
          - Info.plist
          - "*.entitlements"
    dependencies:
      - package: TesseroneKit
        product: TesseroneKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chipcolate.tesserone.watchkitapp
        PRODUCT_NAME: TesseroneWatch
        INFOPLIST_FILE: TesseroneWatch/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: TesseroneWatch/TesseroneWatch.entitlements
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        SKIP_INSTALL: "YES"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "17"
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: HNF5BY9XXV
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
  TesseroneWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TesseroneWidget
        excludes:
          - Info.plist
          - "*.entitlements"
    dependencies:
      - package: TesseroneKit
        product: TesseroneKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chipcolate.tesserone.widget
        PRODUCT_NAME: TesseroneWidget
        INFOPLIST_FILE: TesseroneWidget/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: TesseroneWidget/TesseroneWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "17"
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: HNF5BY9XXV
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SWIFT_EMIT_LOC_STRINGS: "YES"
  TesseroneShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TesseroneShare
        excludes:
          - Info.plist
          - "*.entitlements"
    dependencies:
      - package: TesseroneKit
        product: TesseroneKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chipcolate.tesserone.share
        PRODUCT_NAME: TesseroneShare
        INFOPLIST_FILE: TesseroneShare/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: TesseroneShare/TesseroneShare.entitlements
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "17"
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: HNF5BY9XXV
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
